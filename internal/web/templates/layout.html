<!doctype html>
<html lang="en" style="--accent: {{.Settings.accent}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{with .Title}}{{.}} · {{end}}{{.Settings.name}}</title>
<link rel="stylesheet" href="{{static "app.css"}}">
<script src="{{static "app.js"}}" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="{{base}}/">{{.Settings.name}}</a>
  {{with .User}}
  <nav>
    <a href="{{base}}/" {{if eq $.Nav "home"}}aria-current="page"{{end}}>Languages</a>
    <a href="{{base}}/activity" {{if eq $.Nav "activity"}}aria-current="page"{{end}}>Activity</a>
    <a href="{{base}}/account" {{if eq $.Nav "account"}}aria-current="page"{{end}}>My edits</a>
    {{if .IsAdmin}}
    <a href="{{base}}/admin" {{if eq $.Nav "admin"}}aria-current="page"{{end}}>Settings</a>
    <a href="{{base}}/admin/users" {{if or (eq $.Nav "users") (eq $.Nav "merge")}}aria-current="page"{{end}}>Users</a>
    {{end}}
    <form method="post" action="{{base}}/logout"><button class="link" title="Log out {{.Email}}">Log out</button></form>
  </nav>
  {{end}}
</header>
<main>
{{with .Flash}}<p class="flash" role="status">{{.}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>
