{{define "content"}}
{{$d := .Data}}
{{if $d.Lang}}
<p class="crumbs"><a href="/">Languages</a> / <a href="/t/{{$d.Lang}}">{{langName $d.Lang}}</a> /</p>
<h1>Activity <span class="muted">in {{langName $d.Lang}}</span></h1>
{{else}}
<h1>Activity</h1>
{{end}}
<p class="muted small">Recent edits and approvals{{if gt $d.Page 1}} · page {{$d.Page}}{{end}}. Imports aren't listed.</p>
{{template "activity-table" $d}}
{{end}}
